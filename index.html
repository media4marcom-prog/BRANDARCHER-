<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Archer | Advertising</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans">
    <header class="bg-slate-900 text-white p-6 shadow-xl text-center">
        <h1 class="text-4xl font-extrabold tracking-tighter">BRAND ARCHER</h1>
        <p class="text-blue-400 font-medium uppercase tracking-widest text-sm mt-1">360° Advertising Solutions</p>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-10">
        <div class="grid md:grid-cols-3 gap-6 bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
            <div class="bg-slate-900 text-slate-300 p-8">
                <h2 class="text-white text-xl font-bold mb-6 border-b border-slate-700 pb-2 text-center md:text-left">Premium Services</h2>
                <ul class="space-y-4 text-sm">
                    <li class="flex items-center"><i class="fas fa-bullseye mr-3 text-blue-500"></i> Digital Marketing</li>
                    <li class="flex items-center"><i class="fas fa-paint-brush mr-3 text-blue-500"></i> Brand Branding</li>
                    <li class="flex items-center"><i class="fas fa-ad mr-3 text-blue-500"></i> Outdoor Media</li>
                    <li class="flex items-center"><i class="fas fa-chart-line mr-3 text-blue-500"></i> Social Media</li>
                </ul>
            </div>

            <div class="md:col-span-2 p-6 flex flex-col h-[550px]">
                <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 mb-4 p-2 scrollbar-thin">
                    <div class="flex">
                        <div class="bg-blue-600 text-white p-4 rounded-2xl rounded-tl-none shadow-md max-w-[85%] text-sm">
                            Welcome to Brand Archer! 🚀 I'm your AI Strategist. How can I help you scale your brand today?
                        </div>
                    </div>
                </div>

                <div class="relative flex items-center gap-2 border-t pt-4">
                    <input type="text" id="user-input" placeholder="Ask anything about advertising..." 
                        class="w-full p-4 pr-12 bg-slate-100 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <button onclick="sendMessage()" class="bg-blue-600 text-white p-4 rounded-xl hover:bg-blue-700 shadow-lg active:scale-95 transition-all">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userMsg = input.value.trim();
            if (!userMsg) return;

            // Display User Message
            chatBox.innerHTML += `<div class="flex justify-end"><div class="bg-slate-200 text-slate-800 p-4 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-sm">${userMsg}</div></div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Using Vercel Environment Variable or direct prompt
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=AIzaSyDrYZL-VBl5uqqMyjq3Gb5BunvbkB9aAc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userMsg }] }] })
                });
                const data = await response.json();
                const aiMsg = data.candidates[0].content.parts[0].text;

                chatBox.innerHTML += `<div class="flex"><div class="bg-blue-50 border border-blue-100 text-slate-800 p-4 rounded-2xl rounded-tl-none shadow-md max-w-[85%] text-sm leading-relaxed">${aiMsg}</div></div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="text-red-500 text-xs text-center italic mt-2">Connecting to Brand Archer AI... please wait.</div>`;
            }
